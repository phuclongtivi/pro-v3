name: LONG NEW BUILD PRO R2 CI

on:
  push:
    branches:
      - long-new-build-pro-r2-ci
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  canonical-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated CI branch
        uses: actions/checkout@v4

      - name: Reconstruct NEW BUILD source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/long-pro-r2
          mkdir -p /tmp/long-pro-r2
          cat new-build-ci/source/chunk_*.b64 | base64 -d > /tmp/long-pro-r2.tgz
          tar -xzf /tmp/long-pro-r2.tgz -C /tmp/long-pro-r2
          test -f /tmp/long-pro-r2/package.json
          test -f /tmp/long-pro-r2/native/media-rust/Cargo.toml

      - name: Apply audited S7 Rust raw-string correction
        working-directory: /tmp/long-pro-r2/native/media-rust
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/main.rs")
          s = p.read_text()
          old_start = 'format!(r#"<svg'
          old_end = '</svg>"#,esc(&title))'
          if old_start not in s or old_end not in s:
              raise SystemExit("Expected R2 Rust literal not found; refusing non-deterministic patch")
          s = s.replace(old_start, 'format!(r##"<svg', 1)
          s = s.replace(old_end, '</svg>"##,esc(&title))', 1)
          p.write_text(s)
          print(p.read_text())
          PY

      - name: Apply audited TypeScript CI compatibility correction
        working-directory: /tmp/long-pro-r2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tests/full-innovation-implementation.test.ts")
          s = p.read_text()
          decl = "declare const require:any;\n"
          if not s.startswith(decl):
              raise SystemExit("Expected R2 test require shim not found; refusing non-deterministic patch")
          p.write_text(s[len(decl):])
          print("Removed obsolete require shim now that @types/node is installed")
          PY

      - name: Install stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Build canonical S7 Rust executor
        working-directory: /tmp/long-pro-r2/native/media-rust
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release

      - name: Execute canonical S7 Rust executor
        working-directory: /tmp/long-pro-r2/native/media-rust
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/long-media-preview /tmp/long-pro-r2/s7-rust-preview.svg "Long S7 Canonical Preview" | tee /tmp/s7-rust-output.json
          test -s /tmp/long-pro-r2/s7-rust-preview.svg
          test -s /tmp/s7-rust-output.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          evidence=json.loads(Path('/tmp/s7-rust-output.json').read_text())
          assert evidence.get('nativeMedia') is True, evidence
          assert evidence.get('sha256'), evidence
          print(json.dumps(evidence, indent=2))
          PY

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PRO dependencies
        working-directory: /tmp/long-pro-r2
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund

      - name: Unified prebuild validator
        working-directory: /tmp/long-pro-r2
        shell: bash
        run: |
          set -euo pipefail
          npm run prebuild

      - name: Full Next.js production build
        working-directory: /tmp/long-pro-r2
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: S10 release-control reconciliation
        working-directory: /tmp/long-pro-r2
        shell: bash
        run: |
          set -euo pipefail
          npm run execute:s10 || true
          if [ -f evidence/s10/s10-release-execution.json ]; then
            cat evidence/s10/s10-release-execution.json
          fi

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-pro-r2-ci-evidence
          path: |
            /tmp/s7-rust-output.json
            /tmp/long-pro-r2/s7-rust-preview.svg
            /tmp/long-pro-r2/.next
            /tmp/long-pro-r2/evidence
          if-no-files-found: warn
